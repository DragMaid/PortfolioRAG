# The development database. Tests do not use this service — they start their own
# throwaway container through Testcontainers, so `dotnet test` needs nothing running.
services:
  db:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      # NOTE: 5433 on the host so this never collides with a local postgres on 5432.
      # The port in appsettings.Development.json has to match.
      - "5433:5432"
    volumes:
      - portfolio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio-db-data:
