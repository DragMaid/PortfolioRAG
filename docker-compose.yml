services:
  db:
    image: pgvector/pgvector:pg16
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      # NOTE: 5433 on the host so this never collides with a local postgres on 5432.
      # The port in appsettings.Development.json has to match.
      - "5433:5432"
    volumes:
      - portfolio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for Backblaze B2 locally. The API talks to whichever of the two
  # `Storage:Provider` names, and appsettings.Development.json names this one.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: portfolio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: portfolio
      MINIO_ROOT_PASSWORD: portfolio-secret
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      # S3 API. NEXT_PUBLIC/appsettings point at this one.
      - "9000:9000"
      # Web console, for looking inside the bucket by hand.
      - "9001:9001"
    volumes:
      - portfolio-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once MinIO is up, then exits. Idempotent, so `docker compose up`
  # on an existing volume is a no-op rather than an error.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: portfolio-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # NOTE: the bucket is PRIVATE, which is the whole point of testing against this rather
    # than against a public folder — B2 holds media in a private bucket and every read is a
    # link that expires. `mc anonymous set none` is belt and braces: a fresh MinIO bucket
    # already denies anonymous access, and stating it here means a bucket left over from an
    # earlier experiment with a public policy is put back rather than silently trusted.
    #
    # Versioning is on for the same reason: B2 supersedes rather than overwrites, so
    # S3Storage.DeleteAsync has to clear every version. An unversioned bucket would let that
    # path pass locally and leak objects in production.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 portfolio portfolio-secret &&
      mc mb --ignore-existing local/portfolio-media &&
      mc anonymous set none local/portfolio-media &&
      mc version enable local/portfolio-media &&
      echo 'bucket portfolio-media ready (private, versioned)' &&
      mc anonymous get local/portfolio-media
      "

  # The retrieval worker that handle vector indexing 
  # Scale by running more of these (`docker compose up -d --scale rag=3`)
  rag:
    profiles: ["rag"]
    build: ./rag
    container_name: portfolio-rag
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAG_DATABASE_URL: postgresql://portfolio:portfolio@db:5432/portfolio
      RAG_ENCRYPTION_KEY: ${RAG_ENCRYPTION_KEY:-ZGV2LW9ubHktc2VhbC1rZXktbm90LWZvci1wcm9kISE=}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}

volumes:
  portfolio-db-data:
  portfolio-minio-data:
