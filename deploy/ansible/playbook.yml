# Prepares a shared Ubuntu/Debian VPS to run the portfolio stack. Idempotent — safe to
# re-run whenever this file changes. Day-to-day releases do NOT go through here; they are
# the deploy workflow (.github/workflows/deploy.yml) SSHing in as `deploy`.
#
# What it touches, and deliberately what it does not, because other sites share the host:
#   - installs Docker only when no `docker` binary exists yet (never swaps an existing one)
#   - adds ONE nginx vhost + its certificate; nginx.conf and other sites are left alone,
#     and every reload is preceded by `nginx -t`
#   - creates a `deploy` user that owns /opt/portfolio (docker group = root-equivalent;
#     the key is dedicated to this purpose so it can be revoked on its own)
#   - installs unattended-upgrades for OS security patches and a nightly DB dump cron
#   - does NOT manage the firewall: the stack binds to 127.0.0.1 only, and Docker
#     bypasses ufw rules for published ports anyway

- name: Prepare VPS for the portfolio stack
  hosts: portfolio
  become: true

  vars:
    portfolio_api_domain: "api.{{ portfolio_domain }}"
    deploy_user: deploy
    app_dir: /opt/portfolio
    api_port: 5100
    frontend_port: 3100
    # Largest upload the API accepts (Media:MaxVideoBytes) plus multipart overhead.
    client_max_body_size: 110m

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - unattended-upgrades
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Check for an existing Docker install
      ansible.builtin.command: which docker
      register: docker_binary
      changed_when: false
      failed_when: false

    - name: Install Docker Engine with the compose plugin
      when: docker_binary.rc != 0
      block:
        - name: Create the apt keyrings directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Add Docker's apt key
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Add Docker's apt repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/{{ ansible_distribution | lower }}
              {{ ansible_distribution_release }} stable
            filename: docker
            state: present

        - name: Install Docker packages
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: true

    - name: Ensure the compose plugin is present
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Ensure Docker is running and starts on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create the deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: docker
        append: true

    - name: Authorize the CI deploy key
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ lookup('file', deploy_public_key_file) }}"
        exclusive: false

    - name: Create the app directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/backups"

    # TODO: since app scale is small, nightly is good, if the data become more crucial in the
    # future, we should consider doing PITR (point in time backup)
    - name: Nightly database backup
      ansible.builtin.cron:
        name: portfolio database backup
        user: "{{ deploy_user }}"
        minute: "17"
        hour: "3"
        job: "[ -x {{ app_dir }}/backup.sh ] && {{ app_dir }}/backup.sh nightly >> {{ app_dir }}/backups/backup.log 2>&1"

    # certonly: certbot obtains the certificate without rewriting any config. The vhost
    # below references it, so this has to happen first — and DNS for both names must
    # already point at this server.
    - name: Obtain the TLS certificate
      ansible.builtin.command: >-
        certbot certonly --nginx --non-interactive --agree-tos
        --email {{ letsencrypt_email }}
        --cert-name {{ portfolio_domain }}
        -d {{ portfolio_domain }} -d {{ portfolio_api_domain }}
        --deploy-hook "systemctl reload nginx"
      args:
        creates: "/etc/letsencrypt/live/{{ portfolio_domain }}/fullchain.pem"

    - name: Install the portfolio vhost
      ansible.builtin.template:
        src: templates/nginx-portfolio.conf.j2
        dest: /etc/nginx/sites-available/portfolio.conf
        mode: "0644"
      notify: Reload nginx

    - name: Enable the portfolio vhost
      ansible.builtin.file:
        src: /etc/nginx/sites-available/portfolio.conf
        dest: /etc/nginx/sites-enabled/portfolio.conf
        state: link
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx
      changed_when: true
