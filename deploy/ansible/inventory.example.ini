# Copy to inventory.ini (gitignored) and fill in. Run as a user with sudo:
#   ansible-playbook -i inventory.ini playbook.yml

[portfolio]
vps ansible_host=example_ip ansible_user=root

[portfolio:vars]
portfolio_domain=example.com
letsencrypt_email=you@example.com
deploy_public_key_file=~/.ssh/portfolio-deploy.pub
# letsencrypt (default) needs DNS for both names already pointing at the VPS.
tls_mode=selfsigned
