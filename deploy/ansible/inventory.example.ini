# Copy to inventory.ini (gitignored) and fill in. Run as a user with sudo:
#   ansible-playbook -i inventory.ini playbook.yml

[portfolio]
vps ansible_host=203.0.113.10 ansible_user=root

[portfolio:vars]
portfolio_domain=example.com
letsencrypt_email=you@example.com
# The public half of the key GitHub Actions deploys with (its private half is the
# VPS_SSH_KEY secret). Generate a dedicated one: ssh-keygen -t ed25519 -f portfolio-deploy
deploy_public_key_file=~/.ssh/portfolio-deploy.pub
