# Production stack. The dev stack (database + MinIO for `dotnet run` / `npm run dev`) is
# docker-compose.yml; this one runs everything from the images CI pushes to GHCR.
#
# It lives on the VPS at /opt/portfolio next to a .env the deploy workflow writes — see
# deploy/.env.example for every variable. Nothing here listens publicly: the API and the
# frontend bind to 127.0.0.1 and the host's nginx terminates TLS in front of them, so this
# stack shares ports 80/443 with the other sites on the machine instead of claiming them.
#
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f api

name: portfolio

x-logging: &logging
  # Capped per container, so a noisy service cannot fill the disk the other sites share.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  # Trusts X-Forwarded-For/-Proto from whoever connects. Safe only because the port is
  # bound to loopback and nginx is the only thing that can reach it; without it every
  # visitor has nginx's address and analytics collapses them into one.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  ConnectionStrings__Postgres: Host=db;Port=5432;Database=portfolio;Username=portfolio;Password=${POSTGRES_PASSWORD:?}
  Jwt__Key: ${JWT_KEY:?}
  Llm__EncryptionKey: ${LLM_ENCRYPTION_KEY:?}
  Storage__Provider: Backblaze
  Backblaze__KeyId: ${B2_KEY_ID:?}
  Backblaze__ApplicationKey: ${B2_APPLICATION_KEY:?}
  Backblaze__BucketName: ${B2_BUCKET_NAME:?}
  Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
  # Optional. Left empty, the API writes verification codes to its own log instead of
  # mailing them, and an account that signed up with a password cannot publish until
  # somebody reads one out of `docker compose logs api`.
  Smtp__Host: ${SMTP_HOST:-}
  Smtp__Port: ${SMTP_PORT:-587}
  Smtp__Username: ${SMTP_USERNAME:-}
  Smtp__Password: ${SMTP_PASSWORD:-}
  Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
  Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
  Smtp__FromName: ${SMTP_FROM_NAME:-Portfolio}
  Cors__AllowedOrigins__0: "*"
  Analytics__VisitorSalt: ${ANALYTICS_VISITOR_SALT:?}
  Analytics__SelfHosts__0: ${SITE_DOMAIN:?}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-shot: applies pending EF migrations with the release's own image, then exits. `api`
  # and `rag` wait for it to succeed, so a failed migration stops the rollout before any
  # new code runs against a half-migrated schema.
  migrate:
    image: ${IMAGE_PREFIX:?}/portfolio-api:${IMAGE_TAG:?}
    command: ["--migrate"]
    restart: "no"
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:?}/portfolio-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-5100}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  frontend:
    image: ${IMAGE_PREFIX:?}/portfolio-frontend:${IMAGE_TAG:?}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"
    depends_on:
      - api
    logging: *logging

  # Drains the RagJobs queue. Scale with `--scale rag=N`; workers claim jobs by lease.
  rag:
    image: ${IMAGE_PREFIX:?}/portfolio-rag:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      RAG_DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD:?}@db:5432/portfolio
      # Must be byte-for-byte the API's Llm:EncryptionKey, hence the one shared variable.
      RAG_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:?}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

volumes:
  db-data:
