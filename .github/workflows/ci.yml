name: CI

on:
  pull_request:

# Drop the old test run if a new push to the PR is detected during the process
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # applier/ is a project of its own that happens to live here: blograg does not depend on
  # it, so a pull request that only touches applier/ runs only the applier job, and one that
  # does not touch it (or rag, which it imports) skips that job.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      applier: ${{ steps.applier.outputs.applier }}
      blograg: ${{ steps.blograg.outputs.blograg }}

    steps:
      - uses: actions/checkout@v4

      - id: applier
        uses: dorny/paths-filter@v3
        with:
          filters: |
            applier:
              - 'applier/**'
              # A path dependency: the assessment and the letter are rag's pipelines, and
              # the chat-site provider the applier drives is rag's too.
              - 'rag/**'
              - '.github/workflows/ci.yml'

      # Anything outside applier/ at all. `every` makes a file count only if it matches both
      # patterns — anywhere, and not under applier/.
      - id: blograg
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            blograg:
              - '**'
              - '!applier/**'

  test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.blograg == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ${{ runner.temp }}/test-results

      # Keep the output log for test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  rag:
    name: Retrieval service
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.blograg == 'true'

    # The integration tests and the retrieval eval both want the API's schema, which means a
    # database with pgvector in it — the same image compose runs.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAG_DATABASE_URL: postgresql://portfolio:portfolio@localhost:5433/portfolio
      # A throwaway seal for the run. Nothing here unseals a real key: the tests that touch
      # encryption pin their own fixture key, and no provider is ever called.
      RAG_ENCRYPTION_KEY: ZGV2LW9ubHktc2VhbC1rZXktbm90LWZvci1wcm9kISE=

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The API owns the schema, so the migrations are what create it here too rather than
      # a SQL dump that would quietly drift from them.
      - name: Apply migrations
        run: |
          dotnet tool restore
          dotnet restore backend/backend.csproj
          dotnet ef database update --project backend/backend.csproj
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5433;Database=portfolio;Username=portfolio;Password=portfolio

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: rag/uv.lock

      - name: Install
        working-directory: rag
        run: uv sync --locked

      - name: Lint
        working-directory: rag
        run: uv run ruff check .

      - name: Test
        working-directory: rag
        # Both halves: the unit suite needs nothing, the integration suite needs the
        # database above. Neither calls a provider or spends anything.
        run: uv run pytest -m "integration or not integration" -q

      # Retrieval quality, measured for free. Reports rather than asserts a threshold —
      # a number somebody picked once becomes a suite people pass with --no-verify — but a
      # crash or a collapse in recall shows up in the log where a reviewer sees it.
      - name: Retrieval eval
        working-directory: rag
        run: uv run rag-eval --retrieval-only --container

  applier:
    name: Applier
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.applier == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: applier/uv.lock

      - name: Install
        working-directory: applier
        run: uv sync --locked

      - name: Lint
        working-directory: applier
        run: uv run ruff check .

      # Unit only: no browser, no model, no board. The form tests (-m browser) need
      # camoufox's download and run locally.
      - name: Test
        working-directory: applier
        run: uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            applier/web/package-lock.json
            applier/extension/package-lock.json

      - name: Install the page
        working-directory: applier/web
        run: npm ci

      - name: Typecheck the page
        working-directory: applier/web
        run: npm run lint

      # web/dist is built, never committed; this is the check that it still builds.
      - name: Build the page
        working-directory: applier/web
        run: npm run build

      # The browser extension: its unit tests run under jsdom here. The end-to-end tests
      # (tests/test_extension_e2e.py, -m browser) drive a real Chromium and run locally.
      - name: Install the extension
        working-directory: applier/extension
        run: npm ci

      - name: Test the extension
        working-directory: applier/extension
        run: npm test

      - name: Build the extension
        working-directory: applier/extension
        run: npm run build

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.blograg == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The generated client is committed, so this typechecks the whole app against the
      # API surface as it stood when it was last regenerated. A backend change that has not
      # been regenerated fails here rather than at runtime.
      - name: Build
        working-directory: frontend
        run: npm run build
